# Hook git. Terpasang otomatis lewat `bun install` (script "prepare").
# Lewati hanya dalam keadaan darurat: LEFTHOOK=0 git commit ...  (sebutkan alasannya di PR)
pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{js,jsx,ts,tsx,cjs,mjs,json,jsonc,css,grit}"
      run: "bunx biome check --write --no-errors-on-unmatched --files-ignore-unknown=true --colors=off {staged_files} 2>&1"
      stage_fixed: true
    - name: dependency-cruiser
      glob: "*.{js,jsx,ts,tsx,cjs,mjs}"
      run: bun run lint:deps
